# The CIMD profile's document server: one static document, over https, at the client's URL path.
events {}
http {
  server {
    listen 8443 ssl;
    ssl_certificate     /keys/suite-tls.crt;
    ssl_certificate_key /keys/suite-tls.key;
    location = /agents/payments {
      default_type application/json;
      alias /cimd/payments.json;
    }
  }
}
