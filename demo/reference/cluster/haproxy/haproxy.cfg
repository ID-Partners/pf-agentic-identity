# The reference cluster's front door: TCP passthrough, so TLS ends at PingFederate and a client sees the engines'
# certificate, round robin over the two engines. Each engine is checked over TLS against the stack's CA, with the
# issuer's name, on /pf/heartbeat.ping. The runtime API (an admin socket on the slot's HAPROXY_API port, 127.0.0.1 on
# the host) lets C-7 drain an engine: `echo "set server engines/engine-1 state drain" | nc 127.0.0.1 <port>`.
# The ports come from the environment compose gives it (the slot's), so this file is the same on every slot.
global
    log stdout format raw local0 info
    stats socket ipv4@0.0.0.0:9999 level admin expose-fd listeners
    stats timeout 30s

# Docker's embedded DNS: an engine replaced in a rolling upgrade comes back on a new address, and HAProxy follows its
# name rather than keeping the address it resolved at start (found by the C-7 suite, 2026-10-08: without this both
# servers stayed DOWN on the old addresses after the engines were recreated).
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold obsolete 5s

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout check 5s

frontend runtime
    # Listening inside on the published port number, under the alias pf.reference.test: the issuer's URL is the
    # same in the network and (as localhost) on the host.
    bind :"${REF_RUNTIME_PORT}"
    default_backend engines

backend engines
    balance roundrobin
    option httpchk
    http-check send meth GET uri /pf/heartbeat.ping ver HTTP/1.1 hdr Host pf.reference.test
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 check check-ssl verify required ca-file /tls/ca.crt check-sni pf.reference.test verifyhost pf.reference.test resolvers docker init-addr last,libc,none
    server engine-1 engine-1:"${REF_ENGINE_1_PORT}"
    server engine-2 engine-2:"${REF_ENGINE_2_PORT}"

frontend stats
    mode http
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
