# The reference cluster's SPIRE agent (profile spire): joins with the one-time token up.sh generates, trusts the
# server on first contact (insecure_bootstrap - example-only; a deployment pins trust_bundle_path), and attests
# workloads by their Docker labels through the host's Docker socket.
agent {
  data_dir           = "/var/lib/spire/agent"
  log_level          = "INFO"
  server_address     = "spire-server"
  server_port        = "8081"
  socket_path        = "/tmp/spire-agent/public/api.sock"
  trust_domain       = "reference.test"
  insecure_bootstrap = true
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "disk" {
    plugin_data {
      directory = "/var/lib/spire/agent"
    }
  }

  WorkloadAttestor "docker" {
    plugin_data {}
  }
}
