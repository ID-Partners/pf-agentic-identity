# The reference cluster's SPIRE server (profile spire): trust domain reference.test, agents attested by join token,
# SQLite on a volume, an in-memory CA key. Example-only - a deployment's SPIRE has its own upstream authority and
# datastore. Phase 5 (X-B07) adds the attester's SPIRE reader that uses the bundle up.sh exports.
server {
  bind_address = "0.0.0.0"
  bind_port    = "8081"
  socket_path  = "/tmp/spire-server/private/api.sock"
  trust_domain = "reference.test"
  data_dir     = "/var/lib/spire/server"
  log_level    = "INFO"
  ca_ttl              = "24h"
  default_x509_svid_ttl = "1h"
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type     = "sqlite3"
      connection_string = "/var/lib/spire/server/datastore.sqlite3"
    }
  }

  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "memory" {
    plugin_data {}
  }
}
