# The reference stacks' PostgreSQL: TLS or nothing. Inside the container the image's own initialisation uses the
# socket as the OS user postgres (peer); every network connection must be hostssl with a password, so a plaintext
# one finds no line and is refused.
local   all   postgres            peer
hostssl all   all   0.0.0.0/0     scram-sha-256
hostssl all   all   ::/0          scram-sha-256
