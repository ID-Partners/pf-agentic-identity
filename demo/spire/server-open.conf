# The rig's SPIRE Server without the reference policy (docker-compose.spire.yml with SPIRE_RIG_POLICY=off): server.conf
# less audit_log_enabled and the auth_opa_policy_engine block, otherwise the same. SPIRE's default authorisation
# then admits any local caller that can open the API socket to every method, writes included, so the socket's group
# is the whole of the access control (the reader's README, "Threat model"). For a look at the reader without the
# policy; smoke.sh skips its policy step.
server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  socket_path = "/tmp/spire-server/private/api.sock"
  trust_domain = "rig.example"
  data_dir = "/var/lib/spire/server"
  log_level = "INFO"
  jwt_issuer = "https://spire.rig.example"
  default_jwt_svid_ttl = "5m"
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/var/lib/spire/server/datastore.sqlite3"
    }
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/var/lib/spire/server/keys.json"
    }
  }
  NodeAttestor "join_token" {
    plugin_data {}
  }
}
