# The rig's SPIRE Server (docker-compose.spire.yml). Trust domain rig.example, a sqlite datastore in the
# spire-server-data volume, join-token node attestation, and the reference policy from
# services/spire-entry-reader/spire, which admits only SPIRE's own CLI to write through the API socket (the reader's
# README, "The SPIRE policy"). The policy needs audit_log_enabled: SPIRE fills caller_file_path only with audit logging
# on, and with it on SPIRE refuses a local caller whose PID it cannot see - so the reader shares this container's PID
# namespace (U-0640).
server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  socket_path = "/tmp/spire-server/private/api.sock"
  trust_domain = "rig.example"
  data_dir = "/var/lib/spire/server"
  log_level = "INFO"
  jwt_issuer = "https://spire.rig.example"
  default_jwt_svid_ttl = "5m"
  audit_log_enabled = true
  experimental {
    auth_opa_policy_engine {
      local {
        rego_path = "/opt/spire/conf/server/policy.rego"
        policy_data_path = "/opt/spire/conf/server/policy_data.json"
      }
    }
  }
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/var/lib/spire/server/datastore.sqlite3"
    }
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/var/lib/spire/server/keys.json"
    }
  }
  NodeAttestor "join_token" {
    plugin_data {}
  }
}
